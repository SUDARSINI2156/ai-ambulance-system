version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=super-secret-emergency-ai-production-key-2026
      - DATABASE_URL=sqlite:///./emergency.db
      - PORT=8000
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emergency_ai_frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
